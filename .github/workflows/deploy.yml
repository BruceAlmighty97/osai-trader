name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'tastytrade-service/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for assuming the AWS deploy role
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: osai-trader
  ECS_CLUSTER: osai-trader
  ECS_SERVICE: osai-trader

jobs:
  deploy:
    # Native ARM64 runner (free for public repos) so the ARM image builds without
    # QEMU emulation — QEMU core-dumps on `npm ci` (illegal instruction).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # DeployRoleArn output of the CDK stack — set as a repo variable
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Runner is ARM64, task is ARM64 — a native build, no QEMU needed.
      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: tastytrade-service
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pull the task definition currently on the service (derive its ARN so we
      # don't hardcode the CDK-generated family name).
      - name: Download current task definition
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$TASK_DEF_ARN" \
            --query taskDefinition > task-definition.json

      # Swap in the image we just pushed (immutable short-SHA tag).
      - name: Render new image into the task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: service
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.vars.outputs.sha_short }}

      # Register the new revision and point the service at it (fire-and-forget —
      # don't block on stability; the service's circuit breaker guards rollout).
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: false
